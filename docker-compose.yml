services:
  database:
    build: ./database
    ports: 
      - "5432:5432" 
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/
    networks:
      - backend
  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - database
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL} 
      PUBLIC_SUPABASE_JWT_URL: ${PUBLIC_SUPABASE_JWT_URL}
      PUBLIC_SUPABASE_JWT_AUD: ${PUBLIC_SUPABASE_JWT_AUD}
      FRONTEND_ORIGIN: ${APP_ORIGIN}
      QR_LOGO_SVG_URL: ${QR_LOGO_SVG_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_SENTIMENT_MODEL: ${OPENAI_SENTIMENT_MODEL}
      API_ID_SIGNING_SECRET: ${API_ID_SIGNING_SECRET}
      API_ID_OBFUSCATION_ENABLED: ${API_ID_OBFUSCATION_ENABLED}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "${BACKEND_BASE_URL}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      NEXT_PUBLIC_APP_ORIGIN: ${APP_ORIGIN}
    command: npm run dev
    networks:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
