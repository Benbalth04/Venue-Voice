# Usage:
#   Development:  docker compose --env-file .env.development up --build
#   Production:   docker compose --env-file .env.production \
#                   -f docker-compose.yml -f docker-compose.production.yml up -d
#
# env_file: in each service passes vars to the container at runtime.
#
# Blue/green switch (zero-downtime):
#   1. Build and start the idle container:
#        docker compose --env-file .env.development up -d --build backend_green
#   2. Edit caddy/Caddyfile.dev (dev) or Caddyfile (prod) — swap backend_blue ↔ backend_green
#   3. Reload Caddy without downtime:
#        docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - database

  database:
    build: ./database
    ports:
      - "5432:5432"
    restart: always
    env_file: .env.development
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/
    networks:
      - database

  backend_blue:
    build: ./backend
    container_name: backend_blue
    restart: always
    expose:
      - "5000"
    depends_on:
      - database
      - redis
    env_file: .env.development
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - backend
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend_blue/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend_green:
    build: ./backend
    container_name: backend_green
    restart: always
    expose:
      - "5000"
    depends_on:
      - database
      - redis
    env_file: .env.development
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - backend
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend_green/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "${CADDY_PUBLISH_80:-5000}:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend_blue
      - backend_green
    networks:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        NEXT_PUBLIC_BACKEND_BASE_URL: ${BACKEND_BASE_URL}
        NEXT_PUBLIC_FRONTEND_ORIGIN: ${APP_ORIGIN}
    restart: always
    depends_on:
      - caddy
    ports:
      - "3000:3000"
    env_file: .env.development
    environment:
      NODE_ENV: development
    command: npm run dev
    networks:
      - frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  pg_data:
  caddy_data:
  caddy_config:
