# Usage:
#   Development:  docker compose --env-file .env.development up --build
#   Production:   docker compose --env-file .env.production \
#                   -f docker-compose.yml -f docker-compose.production.yml up -d
#
# env_file: in each service passes vars to the container at runtime.
#
# Blue/green switch (zero-downtime):
#   1. Build and start the idle container:
#        docker compose --env-file .env.development up -d --build backend_green
#   2. Edit nginx/nginx.conf — swap the active server line (blue ↔ green)
#   3. Reload nginx without downtime:
#        docker compose exec nginx nginx -s reload

services:
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend

  database:
    build: ./database
    ports:
      - "5432:5432"
    restart: always
    env_file: .env.development
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/
    networks:
      - backend

  backend_blue:
    build: ./backend
    container_name: backend_blue
    restart: always
    expose:
      - "5000"
    depends_on:
      - database
      - redis
    env_file: .env.development
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend_green:
    build: ./backend
    container_name: backend_green
    restart: always
    expose:
      - "5000"
    depends_on:
      - database
      - redis
    env_file: .env.development
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_blue
      - backend_green
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
    restart: always
    depends_on:
      - nginx
    ports:
      - "3000:3000"
    env_file: .env.development
    environment:
      NODE_ENV: development
    command: npm run dev
    networks:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
