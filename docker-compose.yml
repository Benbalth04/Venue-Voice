services:
  database:
    build: ./database
    ports: 
      - "5432" 
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/
    networks:
      - backend
      - pg_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_USERNAME}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - pg_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      
  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - database
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    command: npm run dev
    networks:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  backend:
    driver: bridge
  pg_network:
    driver: bridge

volumes:
  pg_data:
  pgadmin_data: