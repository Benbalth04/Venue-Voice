# Production overrides — applies live env file and excludes services hosted externally.
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Set in .env.production:
#   CADDY_PUBLISH_80=80
#   API_HOST=api.yourdomain.com
#
# Services excluded in production:
#   - database  → hosted on Supabase
#   - frontend  → hosted on Vercel

services:
  database:
    profiles: [dev-only]

  frontend:
    profiles: [dev-only]

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app

  backend_blue:
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - app
    depends_on:
      database:
        condition: service_started
        required: false
      redis:
        condition: service_started

  backend_green:
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - app
    depends_on:
      database:
        condition: service_started
        required: false
      redis:
        condition: service_started

  uptime_kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - monitoring

  caddy:
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
      - app
      - monitoring
    environment:
      API_HOST: ${API_HOST:-api.example.com}
    depends_on:
      - uptime_kuma

networks:
  edge:
    driver: bridge

  app:
    driver: bridge
    # Must allow outbound internet access (Supabase JWKS, Stripe, Resend, OpenAI).
    internal: false

  monitoring:
    driver: bridge
    internal: true   # isolated from internet

volumes:
  uptime_kuma_data:
