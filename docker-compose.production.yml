# Production overrides — applies live env file and excludes services hosted externally.
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Set in .env.production:
#   API_HOST=api.venuevoice.com.au
#   GRAFANA_ADMIN_USER=admin
#   GRAFANA_ADMIN_PASSWORD=<strong-random-password>
#
# Services excluded in production:
#   - database  → hosted on Supabase
#   - frontend  → hosted on Vercel
#
# Network topology:
#   app        (internal: false) — redis, backends, caddy; outbound internet required
#   monitoring (internal: true)  — loki, grafana, fluent-bit, uptime-kuma, caddy; isolated

services:
  database:
    profiles: [dev-only]

  frontend:
    profiles: [dev-only]

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app

  backend_blue:
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - app
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend_green:
    env_file: .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - app
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  uptime_kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    restart: always
    environment:
      GF_SERVER_ROOT_URL: https://grafana.venuevoice.com.au
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fluent-bit:
    image: fluent/fluent-bit:4.0
    container_name: fluent_bit
    restart: always
    # Root required to read docker-owned log files under /var/lib/docker/containers
    user: root
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./fluent-bit/scripts:/fluent-bit/scripts:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_db:/fluent-bit/db
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy

  caddy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    networks:
      - app
      - monitoring
    environment:
      API_HOST: ${API_HOST:-api.example.com}
    depends_on:
      - uptime_kuma
      - grafana

networks:
  app:
    driver: bridge
    # Must allow outbound internet access (Supabase JWKS, Stripe, Resend, OpenAI, Sentry).
    internal: false

  monitoring:
    driver: bridge
    internal: true   # fully isolated; Caddy bridges in from outside

volumes:
  uptime_kuma_data:
  loki_data:
  grafana_data:
  fluent_bit_db:
