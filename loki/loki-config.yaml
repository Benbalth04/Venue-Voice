auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: loki
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Reject logs with timestamps older than 7 days (protects against clock skew)
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Retain logs for 30 days
  retention_period: 720h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_label_names_per_series: 10
  # Single-node: enforce rate limits locally instead of querying peer ingesters.
  # Prevents "empty ring" errors from the distributed rate store.
  ingestion_rate_strategy: local

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m
  delete_request_store: filesystem
  compactor_ring:
    kvstore:
      store: inmemory
      
analytics:
  reporting_enabled: false
