[SERVICE]
    Flush         5
    Log_Level     warn
    Daemon        Off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   Off

# ─── INPUT ────────────────────────────────────────────────────────────────────
# Tail Docker container log files written by the docker json-file log driver.
# Docker writes each line as JSON: {"log":"<msg>\n","stream":"stdout","time":"..."}
# Tag_Regex extracts the 64-char container ID from the path into the tag.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.${container_id}
    Tag_Regex         containers\/(?<container_id>[a-f0-9]{64})\/
    Parser            docker_json
    DB                /fluent-bit/db/flb_state.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Rotate_Wait       30
    # Exclude fluent-bit's own logs to prevent a feedback loop
    Exclude_Path      *fluent_bit*

# ─── FILTER: resolve container name ───────────────────────────────────────────
# Reads Docker's config.v2.json from the bind-mounted /var/lib/docker/containers
# directory to resolve container ID → name. No Docker socket required.
# Results are cached in-process for the lifetime of Fluent Bit.
[FILTER]
    Name    lua
    Match   docker.*
    Script  /fluent-bit/scripts/docker_meta.lua
    Call    enrich_docker_metadata

# ─── OUTPUT: forward to Loki ──────────────────────────────────────────────────
# Stream labels kept low-cardinality: job + container_name only.
# Query logs in Grafana with: {job="docker", container_name="backend_blue"}
[OUTPUT]
    Name             loki
    Match            docker.*
    Host             loki
    Port             3100
    Labels           job=docker
    Label_Keys       $container_name
    Line_Format      json
    Retry_Limit      5
    Workers          1
