[SERVICE]
    Flush         5
    Log_Level     warn
    Daemon        Off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   Off

# ─── INPUT ────────────────────────────────────────────────────────────────────
# Tail Docker container log files written by the docker json-file log driver.
# Docker writes each line as JSON: {"log":"<msg>\n","stream":"stdout","time":"..."}
# Tag_Regex extracts the 64-char container ID from the path into the tag.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.${container_id}
    Tag_Regex         containers\/(?<container_id>[a-f0-9]{64})\/
    Parser            docker_json
    DB                /fluent-bit/db/flb_state.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Rotate_Wait       30
    # Exclude fluent-bit's own logs to prevent a feedback loop
    Exclude_Path      *fluent_bit*

# ─── FILTER: resolve container name ───────────────────────────────────────────
# Reads Docker's config.v2.json from the bind-mounted /var/lib/docker/containers
# directory to resolve container ID → name. No Docker socket required.
# Results are cached in-process for the lifetime of Fluent Bit.
[FILTER]
    Name    lua
    Match   docker.*
    Script  /fluent-bit/scripts/docker_meta.lua
    Call    enrich_docker_metadata

# ─── FILTER: strip trailing newline from 'log' field ─────────────────────────
# Docker's json-file driver appends \n to every log line, producing:
#   {"level":"info","service":"backend",...}\n
# That trailing newline makes Fluent Bit's JSON parser fail silently and leave
# 'log' as a raw string in Loki.  This Lua filter trims it first.
[FILTER]
    Name    lua
    Match   docker.*
    Script  /fluent-bit/scripts/strip_log_newline.lua
    Call    strip_log_newline

# ─── FILTER: parse backend JSON from the 'log' field ─────────────────────────
# After docker_json runs, 'log' is a raw string containing the backend's JSON
# object (e.g. {"event_type":"request_completed","latency_ms":42.5,...}).
# This filter parses that string and promotes its keys to the top level so that
# Loki / Grafana can query fields like service, level, and latency_ms directly.
# Reserve_Data keeps 'stream' and 'container_name'; Preserve_Key Off drops the
# now-redundant 'log' string once parsing succeeds.
# If the log field is not JSON (e.g. nginx plain text), parsing fails silently
# and Reserve_Data keeps the original record intact.
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       app_json
    Reserve_Data On
    Preserve_Key Off

# ─── OUTPUT: forward to Loki ──────────────────────────────────────────────────
# service, level, environment are low-cardinality app fields — safe as labels.
# container_name identifies which container the log came from.
# High-cardinality fields (request_id, latency_ms, etc.) stay in the log body.
#
# Label-based queries:
#   {job="docker", service="venue-voice-backend"}
#   {job="docker", level="error"}
#   {job="docker", environment="production"}
[OUTPUT]
    Name             loki
    Match            docker.*
    Host             loki
    Port             3100
    Labels           job=docker
    Label_Keys       $container_name,$service,$level,$environment
    Line_Format      json
    Retry_Limit      5
    Workers          1
