[SERVICE]
    Flush         5
    Log_Level     warn
    Daemon        Off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   Off

# ─── INPUT ────────────────────────────────────────────────────────────────────
# Tail Docker container log files written by the docker json-file log driver.
# Docker writes each line as JSON: {"log":"<msg>\n","stream":"stdout","time":"..."}
# Tag_Regex extracts the 64-char container ID from the path into the tag.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               docker.*
    Tag_Regex         containers\/(?<container_id>[a-f0-9]{64})\/
    Parser            docker_json
    DB                /fluent-bit/db/flb_state.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Rotate_Wait       30
    # Exclude fluent-bit's own logs to prevent a feedback loop
    Exclude_Path      *fluent_bit*

# ─── FILTER: enrich with Docker metadata ──────────────────────────────────────
# Calls the Docker Engine API via the mounted socket to resolve the container ID
# (embedded in the tag) to container_name, container_image, and Docker labels
# (including com.docker.compose.service). Results are cached for 5 minutes.
[FILTER]
    Name          docker_metadata
    Match         docker.*
    Docker_URL    unix:///var/run/docker.sock
    Cache_TTL     300

# ─── OUTPUT: forward to Loki ──────────────────────────────────────────────────
# Labels are kept low-cardinality: job + container_name only.
# Query logs in Grafana with: {job="docker", container_name="backend_blue"}
[OUTPUT]
    Name             loki
    Match            docker.*
    Host             loki
    Port             3100
    Labels           job=docker
    Label_Keys       $container_name
    Line_Format      json
    Retry_Limit      5
    Workers          1
