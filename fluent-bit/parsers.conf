# Docker json-file log driver parser.
# Docker daemon writes each container log line as a JSON object:
#   {"log":"<message>\n","stream":"stdout","time":"2024-01-01T00:00:00.123456789Z"}
# This parser unpacks the JSON and promotes the 'time' field to the record timestamp.
[PARSER]
    Name        docker_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%NZ
    Time_Keep   Off
    Decode_Field_As escaped_utf8 log

# Plain JSON parser used to unpack the backend's structured log object from the
# 'log' field (which docker_json leaves as a raw string).  No Time_Key here —
# the record timestamp was already set by docker_json above.
[PARSER]
    Name   app_json
    Format json
